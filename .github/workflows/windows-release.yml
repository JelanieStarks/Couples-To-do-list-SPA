name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [codex/desktop-parity-fixes, codex/life-meeting-sync-hotfix]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_ENABLE_SUPABASE_AUTH: 'true'
      VITE_ENABLE_SUPABASE_SYNC: 'true'
      VITE_ENABLE_SUPABASE_ROUTINE_SYNC: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --reporter=dot
      - run: npm run test:desktop
      - name: Verify cloud configuration
        run: node scripts/check-backend.mjs
      - name: Build Windows installer
        run: npm run build:desktop:win -- --publish=never
      - name: Verify update files
        run: node scripts/check-windows-artifacts.mjs
      - name: Launch packaged app
        run: node scripts/smoke-desktop.mjs
      - name: Upload installer and update files
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error


  publish-beta:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/codex/desktop-parity-fixes' || github.ref == 'refs/heads/codex/life-meeting-sync-hotfix')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release
      - name: Publish easy-download Windows beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')
          tag="windows-beta-v${version}-r${GITHUB_RUN_NUMBER}"
          gh release create "$tag" release/*.exe release/*.exe.blockmap release/latest.yml \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Couples 2Do Windows Beta ${version}" --prerelease --latest=false \
            --notes "Download the Setup EXE below and open it. One-click setup installs for your account, creates shortcuts, and opens Couples 2Do. Includes autosave, verified Save & Sync with local backups, and native in-app update controls. The packaged app passed its automated startup check; couple sync and printing still need hands-on beta testing."
