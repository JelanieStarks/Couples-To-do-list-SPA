name: Build Windows Installer

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_ENABLE_SUPABASE_AUTH: 'true'
      VITE_ENABLE_SUPABASE_SYNC: 'true'
      VITE_ENABLE_SUPABASE_ROUTINE_SYNC: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --reporter=dot
      - run: npm run test:desktop
      - name: Verify cloud configuration
        run: node scripts/check-backend.mjs
      - name: Build Windows installer
        run: npm run build:desktop:win -- --publish=never
      - name: Verify update files
        run: node scripts/check-windows-artifacts.mjs
      - name: Upload installer and update files
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

